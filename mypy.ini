[mypy]
python_version = 3.12
warn_return_any = True
warn_unused_configs = True

# Third-party packages without stubs
[mypy-rich.*]
ignore_missing_imports = True

[mypy-aiohttp.*]
ignore_missing_imports = True

[mypy-dotenv.*]
ignore_missing_imports = True

[mypy-cryptography.*]
ignore_missing_imports = True

[mypy-jwt.*]
ignore_missing_imports = True
